# ClinTox (FDA approval + clinical-trial toxicity) — 2-task binary classification, 1478 molecules
# Metrics are averaged over the two tasks; the scaffold split is stratified on
# the joint label pattern so both tasks keep both classes in val/test.
dataset: CLINTOX
data_root: ./data

# --- Model architecture ---
hidden_dim: 128
num_layers: 3
dropout: 0.3
num_heads: 4          # GAT only; hidden_dim must be divisible by num_heads

# --- Training ---
batch_size: 32        # small dataset -> smaller batch keeps enough steps per epoch
lr: 0.001
weight_decay: 1.0e-5
epochs: 100
patience: 20          # early stopping patience (epochs without mean val AUC improvement)

# --- Scaffold split ---
split: scaffold
train_frac: 0.8
val_frac: 0.1
test_frac: 0.1
split_dir: ./data/splits
